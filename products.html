<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="description" content="产品中心 - 成都核聚能科技有限公司">
<title>产品中心 - 成都核聚能科技有限公司</title>
<link rel="stylesheet" href="css/style.css">
<style>
.goods-grid { display:grid; grid-template-columns:repeat(4, 1fr); gap:20px; }
.goods-card { background:#fff; border-radius:4px; overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,0.06); transition:all 0.3s ease; }
.goods-card:hover { transform:translateY(-4px); box-shadow:0 6px 20px rgba(0,0,0,0.12); }
.goods-card .goods-img-wrap { position:relative; overflow:hidden; height:180px; }
.goods-card .goods-img-wrap img { width:100%; height:100%; object-fit:cover; transition:transform 0.4s ease; }
.goods-card:hover .goods-img-wrap img { transform:scale(1.05); }
.goods-card .goods-img-wrap .img-shade { position:absolute; top:0;left:0;right:0;bottom:0; background:rgba(18,33,47,0); transition:all 0.3s ease; }
.goods-card:hover .goods-img-wrap .img-shade { background:rgba(18,33,47,0.06); }
.goods-card .goods-info { padding:14px 16px; }
.goods-card .goods-info .goods-tit { font-size:14px; color:#12212f; font-weight:600; margin-bottom:4px; }
.goods-card .goods-info .goods-desc { font-size:12px; color:#999; }
.cat-section { margin-bottom:48px; }
.cat-section h3 { font-size:22px; color:#12212f; margin-bottom:4px; }
.cat-section .cat-en { font-size:14px; color:#a2b0bc; margin-bottom:8px; }
.cat-section .cat-desc { font-size:14px; color:#666; margin-bottom:20px; }
.cat-divider { width:60px; height:3px; background:#ffad00; margin-bottom:20px; }
@media(max-width:1024px){.goods-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:768px){.goods-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:480px){.goods-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header class="header"><div class="container">
<a href="index.html" class="logo"><img src="images/logo.png" alt="成都核聚能科技有限公司" style="height:52px;"></a>
<div class="nav-toggle" id="navToggle"><span></span><span></span><span></span></div>
<nav class="nav" id="nav">
<a href="index.html">首页</a>
<div class="dropdown"><a href="products.html" class="active">产品中心</a><div class="dropdown-menu" id="prodDropdown"></div></div>
<a href="news.html">行业新闻</a>
<a href="service.html">服务支持</a>
<div class="dropdown"><a href="about.html">关于我们</a><div class="dropdown-menu"><a href="about.html">公司简介</a><a href="contact.html">联系我们</a></div></div>
</nav></div></header>

<section class="page-banner"><div class="container"><h2>产品中心</h2><div class="breadcrumb"><a href="index.html">首页</a><span>/</span>产品中心</div></div></section>

<section class="section"><div class="container">
<div class="products-layout">
<aside class="sidebar"><div class="sidebar-title">产品分类</div><div class="sidebar-nav" id="sideNav"></div></aside>
<div id="prodsContent"></div>
</div></div></section>

<footer class="footer">
<div class="footer-top"><a href="products.html">产品中心</a><a href="about.html">关于我们</a><a href="contact.html">联系我们</a></div>
<div class="container footer-mid"><div class="footer-logo"><img src="images/logo.png" alt="" style="height:48px;"><span class="name">成都核聚能科技有限公司</span></div><div class="footer-tel">服务热线：<span>18884381886</span></div></div>
<div class="footer-bottom">Copyright &copy; <span id="cy">2025</span> 成都核聚能科技有限公司 All Rights Reserved. <a href="https://beian.miit.gov.cn/" target="_blank">蜀ICP备2026026235号</a></div>
</footer>

<button id="scrollTopBtn" style="display:none;position:fixed;bottom:30px;right:30px;width:44px;height:44px;background:#12212f;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:20px;z-index:999;">↑</button>

<script src="data/config.js"></script>
<script src="data/products.js"></script>
<script src="js/main.js"></script>
<script>
(function(){
// Build sidebar + dropdown nav
var sn=document.getElementById('sideNav');
var pd=document.getElementById('prodDropdown');
var pc=document.getElementById('prodsContent');
PRODUCTS_DATA.forEach(function(cat){
    // Sidebar
    var a=document.createElement('a');a.href='#'+cat.id;a.textContent=cat.name;
    a.addEventListener('click',function(e){e.preventDefault();document.getElementById(cat.id).scrollIntoView({behavior:'smooth'});});
    sn.appendChild(a);
    // Product dropdown nav
    var da=document.createElement('a');da.href='#'+cat.id;da.textContent=cat.name;
    pd.appendChild(da);
    // Category section
    var sec=document.createElement('div');sec.id=cat.id;sec.className='cat-section';
    var cards=cat.items.map(function(item){
        return '<a href="'+item.link+'" class="goods-card"><div class="goods-img-wrap"><img src="'+item.brief.img+'" alt="'+item.name+'" loading="lazy"><div class="img-shade"></div></div><div class="goods-info"><p class="goods-tit">'+item.name+'</p><p class="goods-desc">'+item.brief.desc+'</p></div></a>';
    }).join('');
    sec.innerHTML='<h3>'+cat.name+'</h3><div class="cat-en">'+cat.en+'</div><div class="cat-divider"></div><p class="cat-desc">'+cat.desc+'</p><div class="goods-grid">'+cards+'</div>';
    pc.appendChild(sec);
});

// Highlight active sidebar item on scroll
var sideLinks=document.querySelectorAll('.sidebar-nav a');
window.addEventListener('scroll',function(){
    var scrollPos=window.scrollY+150;
    PRODUCTS_DATA.forEach(function(cat,i){
        var el=document.getElementById(cat.id);
        if(el&&el.offsetTop<=scrollPos&&el.offsetTop+el.offsetHeight>scrollPos){
            sideLinks.forEach(function(l){l.classList.remove('active');});
            if(sideLinks[i])sideLinks[i].classList.add('active');
        }
    });
});
sideLinks[0].classList.add('active');
document.getElementById('cy').textContent=new Date().getFullYear();
})();
</script>
</body>
</html>
