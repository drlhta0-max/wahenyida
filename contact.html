<script>
(function(){
var ct=SITE_CONFIG.contact;
var items=[
{icon:'📍',title:'公司地址',text:ct.address+'<br>邮编：'+ct.zip},
{icon:'📞',title:'联系电话',text:ct.phone+'<br>手机：'+ct.mobile},
{icon:'📠',title:'传真',text:ct.fax},
{icon:'📧',title:'电子邮箱',text:ct.email+'<br>'+ct.email2},
{icon:'👤',title:'联系人',text:ct.contactPerson},
{icon:'🕐',title:'工作时间',text:ct.workHours}
];
var ci=document.getElementById('contactInfo');
items.forEach(function(item){
var div=document.createElement('div');div.className='contact-item';
div.innerHTML='<div class="ci-icon">'+item.icon+'</div><div><h5>'+item.title+'</h5><p>'+item.text+'</p></div>';
ci.appendChild(div);
});

var form=document.getElementById('contactForm');
form.addEventListener('submit',function(e){
e.preventDefault();
var btn=form.querySelector('button');var orig=btn.textContent;
btn.textContent='提交中...';btn.disabled=true;
setTimeout(function(){
alert('您的留言已提交成功！我们会尽快与您联系。');
form.reset();btn.textContent=orig;btn.disabled=false;
},500);
});

document.getElementById('cy').textContent=new Date().getFullYear();
})();
</script>
