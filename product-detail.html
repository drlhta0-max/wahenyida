<link rel="stylesheet" href="css/style.css">
<style>
.detail-wrap { max-width:900px; margin:0 auto; }
.detail-wrap .goods-tit { font-size:24px; color:#12212f; font-weight:700; margin-bottom:24px; }
.gallery { display:flex; gap:20px; margin-bottom:40px; }
.gallery .thumb-strip { width:80px; flex-shrink:0; }
.gallery .thumb-strip .thumb-list { display:flex; flex-direction:column; gap:8px; }
.gallery .thumb-strip .thumb-list img { width:80px; height:60px; object-fit:cover; border:2px solid transparent; border-radius:4px; cursor:pointer; transition:border-color 0.2s; }
.gallery .thumb-strip .thumb-list img.active, .gallery .thumb-strip .thumb-list img:hover { border-color:#ffad00; }
.gallery .preview-box { flex:1; border-radius:4px; overflow:hidden; background:#f5f5f5; display:flex; align-items:center; justify-content:center; min-height:400px; }
.gallery .preview-box img { max-width:100%; max-height:500px; object-fit:contain; display:block; }
.detail-wrap .part-tit { font-size:18px; color:#12212f; font-weight:700; margin-bottom:16px; padding-bottom:8px; border-bottom:2px solid #ffad00; }
.detail-wrap .goods-cont { font-size:15px; color:#333; line-height:2; }
.detail-wrap .goods-cont p { margin-bottom:12px; text-indent:2em; }
.detail-wrap .goods-cont table { width:100%; border-collapse:collapse; margin:20px 0; }
.detail-wrap .goods-cont td { padding:10px; border:1px solid #ddd; font-size:14px; }
.detail-wrap .btn-contact { margin-top:32px; text-align:center; }
.detail-wrap .btn-contact a { display:inline-block; padding:12px 48px; background:#ffad00; color:#12212f; font-size:16px; font-weight:600; border-radius:4px; transition:all 0.3s; }
.detail-wrap .btn-contact a:hover { background:#e69c00; }
.notfound { text-align:center; padding:80px 20px; }
@media(max-width:768px){.gallery{flex-direction:column-reverse}.gallery .thumb-strip .thumb-list{flex-direction:row;overflow-x:auto}}
</style>
</head>

<script>
(function(){
var params=new URLSearchParams(window.location.search);
var pid=params.get('id');
var found=null, catInfo=null;
PRODUCTS_DATA.forEach(function(cat){
    cat.items.forEach(function(item){
        if(item.link.indexOf('id='+pid)>-1){found=item;catInfo=cat;}
    });
});

var dc=document.getElementById('detailContent');
if(!found){
    dc.innerHTML='<div class="notfound"><h2>产品未找到</h2><p>请返回<a href="products.html">产品中心</a>浏览更多产品。</p></div>';
}else{
    var images = found.images || [found.img];
    var thumbs = images.map(function(img,i){
        return '<img src="'+img+'" class="'+(i===0?'active':'')+'" onclick="switchImage('+i+')" alt="">';
    }).join('');

    dc.innerHTML=
        '<h1 class="goods-tit">'+found.name+'</h1>'+
        '<div class="gallery">'+
            '<div class="thumb-strip"><div class="thumb-list" id="thumbList">'+thumbs+'</div></div>'+
            '<div class="preview-box"><img src="'+images[0]+'" alt="'+found.name+'" id="previewImg"></div>'+
        '</div>'+
        '<div class="part-tit">产品详情</div>'+
        '<div class="goods-cont">'+
            '<p>'+found.desc+'。'+catInfo.desc+'</p>'+
            '<p>四川科技作为专业核探测设备供应商，为您提供高品质的'+found.name+'产品。该产品属于'+catInfo.name+'类别，广泛应用于核物理实验、辐射探测、环境监测等领域。</p>'+
            '<p>如需了解详细技术参数、获取报价或预约产品演示，欢迎联系我们的销售团队。我们将根据您的具体应用需求，为您推荐最合适的产品配置方案。</p>'+
        '</div>'+
        '<div class="btn-contact"><a href="contact.html">联系我们</a></div>';

    window.switchImage = function(idx){
        document.getElementById('previewImg').src = images[idx];
        document.querySelectorAll('#thumbList img').forEach(function(el,i){
            el.classList.toggle('active', i===idx);
        });
    };
}
document.getElementById('cy').textContent=new Date().getFullYear();
})();
</script>
